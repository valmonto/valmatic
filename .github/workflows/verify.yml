name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + lint + test. Runs on a clean checkout with no dist/, which
      # @pkg/vitest-config supports by aliasing workspace packages to source.
      - run: pnpm verify
