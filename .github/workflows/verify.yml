name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Integration suites are written with `describeIntegration`, which skips when
    # DATABASE_URL is unset. Without a database here they would never run
    # anywhere — the repository layer would be covered on paper only.
    #
    # There is ONE database, so the root `test` script serializes packages
    # (--workspace-concurrency=1): the api and worker suites truncate the same
    # tables, and running them concurrently makes each fail on the other's
    # truncations roughly two runs in three. Do not parallelize the test step
    # without giving each suite its own database first.
    services:
      postgres:
        # Must match compose.staging.yml — uuidv7() defaults need PostgreSQL 18.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: valmatic
          POSTGRES_PASSWORD: valmatic
          POSTGRES_DB: valmatic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The in-process pipeline suite (describeStack) boots the whole api —
      # sessions, throttling and queues all need Redis. Without it that suite
      # skips and a framework change to guards/filters goes unproven.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://valmatic:valmatic@localhost:5432/valmatic_test
      IAM_REDIS_HOST: 127.0.0.1
      IAM_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # db:migrate runs the compiled CLI, so the package has to be built first.
      - name: Apply migrations
        run: |
          pnpm --filter @pkg/database build
          pnpm db:migrate

      # typecheck + lint + test. Runs on a clean checkout with no dist/, which
      # @pkg/vitest-config supports by aliasing workspace packages to source.
      - run: pnpm verify
