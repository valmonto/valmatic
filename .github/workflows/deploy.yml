name: Deploy to Production

on:
  push:
    branches:
      - main
  # Manual runs: exercise the e2e gate on demand (auth/session/cookie changes)
  # without waiting for a deploy.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Gate: main must typecheck, lint and pass tests before anything ships.
  # A compile error would already fail the image build, but a logic error
  # builds and deploys perfectly happily — that is what this catches.
  verify:
    runs-on: ubuntu-latest

    # Same database as verify.yml — without one, describeIntegration suites
    # skip silently and the DEPLOY gate is weaker than the PR gate.
    services:
      postgres:
        # Must match compose.staging.yml — uuidv7() defaults need PostgreSQL 18.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: valmatic
          POSTGRES_PASSWORD: valmatic
          POSTGRES_DB: valmatic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valmatic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The in-process pipeline suite (describeStack) boots the whole api —
      # sessions, throttling and queues all need Redis. Without it that suite
      # skips and a framework change to guards/filters goes unproven.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://valmatic:valmatic@localhost:5432/valmatic_test
      IAM_REDIS_HOST: 127.0.0.1
      IAM_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: |
          pnpm --filter @pkg/database build
          pnpm db:migrate

      - run: pnpm verify

  # The whole stack, booted: postgres, redis, api, web behind HTTPS — then the
  # Playwright specs against it. This is the only place helmet, the throttler,
  # cookies and login are exercised on a RUNNING server, and it gates
  # production only: PRs stay fast, an MVP that never deploys never pays for
  # this. Trigger manually via workflow_dispatch when touching auth/session
  # code.
  #
  # OPT-IN, like every other capability in this template: set the Actions
  # variable E2E_GATE=on (Settings → Secrets and variables → Actions →
  # Variables) when a product has real users and its deploys deserve the
  # ~8 minutes. Until then deploys ride on verify alone and a fresh
  # descendant's first deploy is not gated on example-app specs.
  e2e:
    if: vars.E2E_GATE == 'on'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E stack
        run: |
          mkdir -p apps/e2e/test-results
          docker compose -f compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e

      - name: Teardown
        if: always()
        run: docker compose -f compose.e2e.yml down -v

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/e2e/test-results

  deploy:
    # Manual workflow_dispatch runs the gates without shipping. always() +
    # explicit result checks: without E2E_GATE=on the e2e job is SKIPPED, and
    # a skipped need would otherwise skip deploy too — but when the gate IS on
    # and FAILS, it must still block.
    if: >-
      always() && github.event_name == 'push' &&
      needs.verify.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/vboilerplate
            git pull origin main
            # Build identity for /health. Read from the tree that is ACTUALLY
            # built — if the pull above silently failed, this is the old SHA,
            # and /health will say so (that is the point: a green deploy that
            # shipped nothing becomes visible instead of trusted).
            export GIT_SHA=$(git rev-parse HEAD)
            export BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            echo "Building $GIT_SHA at $BUILT_AT"
            # --wait blocks until services are healthy and exits non-zero if any
            # container is unhealthy or crash-looping (so a bad deploy is RED, not a
            # silently-green deploy hiding a rebooting api). On failure, dump status +
            # logs so the crash reason shows up directly in this CI output.
            if ! docker compose -f compose.staging.yml up -d --build --wait --wait-timeout 180; then
              echo "===== DEPLOY UNHEALTHY — diagnostics ====="
              docker compose -f compose.staging.yml ps
              echo "----- api logs -----"
              docker compose -f compose.staging.yml logs --tail 200 api
              echo "----- worker logs -----"
              docker compose -f compose.staging.yml logs --tail 80 worker
              echo "----- web logs -----"
              docker compose -f compose.staging.yml logs --tail 80 web
              exit 1
            fi
            echo "Deploy healthy."
            # Prove the running api is the build we just made, not a survivor.
            # The container's own GIT_SHA is baked in at build time, so the
            # expected value is passed in separately. `node` runs in the image
            # (the host may not have curl/jq).
            if ! docker compose -f compose.staging.yml exec -T -e EXPECTED_SHA="$GIT_SHA" api node -e "
              fetch('http://127.0.0.1:3000/health').then(r => r.json()).then(h => {
                console.log('running sha=' + h.sha + ' uptime=' + h.uptime + 's');
                if (h.sha !== process.env.EXPECTED_SHA) { console.error('expected ' + process.env.EXPECTED_SHA); process.exit(1); }
              })"; then
              echo "===== DEPLOYED CODE DOES NOT MATCH THE SHA JUST BUILT ====="
              exit 1
            fi
