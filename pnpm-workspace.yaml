packages:
  - apps/*
  - packages/*

# Force a single lightningcss version: react-native-css 3.0.7 (NativeWind v5's
# CSS engine) was built against lightningcss ^1.30.1 and cannot deserialize the
# changed @import "Specifier" AST that 1.32.0 emits (Metro bundling fails with
# "failed to deserialize; expected an object-like struct named Specifier,
# found ()"). Pin until NativeWind v5 catches up to newer lightningcss.
overrides:
  lightningcss: 1.30.1
  # One copy of the React DOM types: mobile's Radix packages (through
  # @rn-primitives) take @types/react-dom as an optional peer, which pnpm
  # would auto-install at the newest (19.3, wanting @types/react 19.3) next to
  # the 19.2 types both apps use — two copies break web's typecheck (TS2883).
  # Keep equal to the catalog pin; drop with the Expo 58 / React 19.3 move.
  '@types/react-dom': 19.2.7
  # fast-uri (through ajv) had host-confusion and normalization
  # advisories fixed in 3.1.7 / 4.1.5, and two more (GHSA-w74x-v6f9-j3xg,
  # GHSA-wjr9-j795-jxcr) in 3.1.9 / 4.2.3. Nothing here validates a URI for a
  # security decision today; the pins keep it that way should one be added.
  'fast-uri@3': 3.1.9
  'fast-uri@4': 4.2.3

# ---------------------------------------------------------------------------
# Catalog — single source of truth for dependency versions across the
# monorepo. Grouped by where each dependency is actually consumed:
#   • Repo tooling        — root-level release / lint / commit / format
#   • Shared toolchain    — TS, ESLint, test runners used by every package
#   • Shared runtime      — imported by both frontend and backend app code
#   • Backend             — apps/api, apps/worker, packages/{server,database}
#   • Frontend            — apps/web
#   • E2E                 — apps/e2e
# ---------------------------------------------------------------------------
catalog:
  # ═══════════════════════════════════════════════════════════════════════
  #  REPO TOOLING  (root devDependencies)
  #  Release automation, changelog, git hooks, commit linting, formatting.
  # ═══════════════════════════════════════════════════════════════════════
  '@commitlint/cli': 21.2.4
  '@commitlint/config-conventional': 21.2.4
  git-cliff: 2.14.2
  husky: 9.1.7
  release-it: 21.1.2

  # ═══════════════════════════════════════════════════════════════════════
  #  SHARED TOOLCHAIN  (TS / lint / test — used by every package)
  # ═══════════════════════════════════════════════════════════════════════
  typescript: 7.0.2
  oxlint: 1.91.0
  oxlint-tsgolint: 7.0.2005
  oxfmt: 0.76.0
  '@types/node': 26.6.6
  vitest: 5.1.0
  '@vitest/coverage-v8': 5.1.0
  tsdown: 0.23.5 # library bundler for packages/*

  # ═══════════════════════════════════════════════════════════════════════
  #  SHARED RUNTIME  (imported by both frontend and backend app code)
  # ═══════════════════════════════════════════════════════════════════════
  axios: 1.21.0
  zod: 4.6.7
  # ═══════════════════════════════════════════════════════════════════════
  #  BACKEND  (apps/api, apps/worker, packages/server, packages/database)
  # ═══════════════════════════════════════════════════════════════════════

  # NestJS (on its own Node adapter)
  '@nestjs/common': 12.4.0
  '@nestjs/core': 12.4.0
  '@nestjs/cli': 12.0.11
  '@nestjs/config': 12.1.0
  '@nestjs/event-emitter': 12.0.1
  '@nestjs/jwt': 12.0.3
  '@nestjs/platform-node': 12.4.0
  '@nestjs/testing': 12.4.0
  '@nestjs/throttler': 6.7.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

  # Queues / cache
  '@nestjs/bullmq': 12.0.0
  bullmq: 6.6.0
  ioredis: 6.0.0

  # Database (Drizzle + Postgres)
  drizzle-orm: 1.0.0-rc.3
  drizzle-kit: 1.0.0-rc.3
  postgres: 3.4.9

  # Auth
  bcryptjs: 3.0.3
  jose: 6.2.15

  # MCP — agent access to a deployed instance, env-gated off
  '@modelcontextprotocol/sdk': 1.32.2
  # Telemetry (server) — error reporting + product analytics, env-gated no-ops
  '@sentry/node': 10.73.0
  posthog-node: 5.61.2
  # Logging (Pino)
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  pino-pretty: 13.2.0

  # i18n (server-side)
  nestjs-i18n: 10.8.5

  # Object storage (S3-compatible: rustfs/MinIO/R2/S3 — see docs/storage.md)
  '@aws-sdk/client-s3': 3.1161.0
  '@aws-sdk/s3-request-presigner': 3.1161.0
  # ═══════════════════════════════════════════════════════════════════════
  #  FRONTEND  (apps/web)
  # ═══════════════════════════════════════════════════════════════════════

  # React core + routing
  react: 19.3.1
  react-dom: 19.3.1
  react-router: 8.5.1
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  # Data / state / forms
  swr: 2.5.1
  zustand: 5.0.16
  react-hook-form: 7.91.0
  react-error-boundary: 6.1.6
  date-fns: 4.4.0

  # UI components / primitives
  radix-ui: 1.8.1
  '@base-ui/react': 1.9.0
  lucide-react: 1.68.0
  '@fontsource-variable/inter': 5.3.0
  '@fontsource-variable/jetbrains-mono': 5.3.0
  cmdk: 1.1.1
  sonner: 2.0.8
  vaul: 1.1.2
  input-otp: 1.5.0
  next-themes: 0.4.6
  embla-carousel-react: 8.6.0
  react-day-picker: 10.0.2
  react-resizable-panels: 4.18.0
  recharts: 3.10.1

  # Styling
  tailwindcss: 4.3.4
  '@tailwindcss/vite': 4.3.4
  tailwind-merge: 3.7.0
  tw-animate-css: 1.4.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1

  # i18n (client-side)
  i18next: 26.7.1
  i18next-browser-languagedetector: 8.3.0
  react-i18next: 17.1.12
  # Telemetry (web) — analytics, session replay, frontend errors; env-gated
  posthog-js: 1.445.3
  # Build + test (web)
  vite: 8.3.5
  '@vitejs/plugin-react-swc': 4.3.3
  jsdom: 30.1.3
  msw: 2.15.0
  fast-check: 4.10.2
  '@testing-library/react': 16.3.3
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/user-event': 14.6.8
  # addon:mobile begin
  # ═══════════════════════════════════════════════════════════════════════
  #  MOBILE  (apps/mobile) — Expo + React Native
  #  All mobile pins live in the named `mobile` catalog below (see `catalogs:`),
  #  kept separate because it needs its own React version (19.2.3, Expo's) that
  #  differs from the web React above. Shared libs (swr, zustand, zod, axios,
  #  react-hook-form, date-fns, i18next, react-i18next, tailwindcss) are reused
  #  from this default catalog via `catalog:`.
  # ═══════════════════════════════════════════════════════════════════════

  # addon:mobile end

  # ═══════════════════════════════════════════════════════════════════════
  #  E2E  (apps/e2e)
  # ═══════════════════════════════════════════════════════════════════════
  '@playwright/test': 1.64.1
# ---------------------------------------------------------------------------
# Named catalogs — version groups that can't share the default catalog.
# ---------------------------------------------------------------------------
catalogs:
  # TypeScript 6 for the workspaces whose tooling still needs the programmatic
  # compiler API that TypeScript 7.0 does not ship: the Nest CLI (`nest build`,
  # `nest start`) refuses 7.0 outright and expects the API back in 7.1;
  # mobile's Expo lint stack (typescript-eslint) has the same dependency.
  # Everything else is on the default catalog's TypeScript 7. Delete this
  # catalog and move the three consumers back to `catalog:` when @nestjs/cli
  # and eslint-config-expo accept 7.x.
  ts6:
    typescript: 6.0.3

  # addon:mobile begin
  # apps/mobile (Expo SDK 57). Referenced as `catalog:mobile`.
  #
  # Expo-managed packages (expo, expo-*, react-native*, react) are versioned by
  # the Expo SDK. When bumping the SDK, run `expo install --fix` in apps/mobile
  # and copy the resulting versions back here so the catalog stays the source of
  # truth. (`expo install` writes to the app's package.json, not the catalog.)
  mobile:
    # React — Expo's pinned version (differs from web's default-catalog React)
    react: 19.2.3
    react-dom: 19.2.3
    '@types/react': ~19.2.18

    # Expo SDK + modules
    expo: ~57.0.22
    '@expo/ui': ~57.0.18
    '@expo-google-fonts/inter': 0.4.2
    expo-constants: ~57.0.18
    expo-device: ~57.0.2
    expo-notifications: ~57.0.18
    expo-font: ~57.0.4
    expo-glass-effect: ~57.0.3
    expo-image: ~57.0.5
    expo-linking: ~57.0.10
    expo-blur: ~57.0.3
    expo-haptics: ~57.0.3
    expo-apple-authentication: ~57.0.2
    # Google's own account sheet (no browser). Pinned: the free edition.
    '@react-native-google-signin/google-signin': 16.1.5
    expo-linear-gradient: ~57.0.2
    expo-router: ~57.0.21
    expo-secure-store: ~57.0.4
    expo-splash-screen: ~57.0.9
    expo-store-review: ~57.0.3
    expo-status-bar: ~57.0.1
    expo-symbols: ~57.0.3
    expo-system-ui: ~57.0.4
    expo-updates: ~57.0.22
    expo-web-browser: ~57.0.3

    # React Native + native modules
    react-native: 0.86.3
    react-native-gesture-handler: ~2.32.0
    react-native-reanimated: 4.5.1
    react-native-safe-area-context: ~5.7.0
    react-native-screens: 4.26.2
    react-native-svg: 15.15.4
    react-native-web: ~0.21.2
    react-native-worklets: 0.10.1

    # Styling — NativeWind v5 (Tailwind v4). nativewind ships only prereleases
    # today, so the exact preview tag is required (^5.0.0 excludes prereleases).
    nativewind: 5.0.0-preview.4
    react-native-css: ^3.0.7 # NW5 peer (formerly react-native-css-interop; at 3.x)
    '@tailwindcss/postcss': 4.3.0 # Tailwind v4 via PostCSS in Metro (web uses @tailwindcss/vite)

    # Lint — mobile keeps Expo's ESLint (the rest of the repo lints with oxlint): eslint-config-expo
    # 57 only supports ESLint 9, so the mobile app needs its own ESLint 9 here.
    eslint: ^9.39.4
    eslint-config-expo: ~57.0.2

    # UI — icons, charts, toasts (RNR components are copied in, not a dep)
    lucide-react-native: 1.21.0
    victory-native: 41.26.0 # charts — recharts does not run in RN
    sonner-native: 0.26.2

    # RNR component primitives (the accessible base layer RNR components build on).
    # Whole family is versioned in lockstep — keep versions identical.
    '@rn-primitives/accordion': 1.5.2
    '@rn-primitives/alert-dialog': 1.5.2
    '@rn-primitives/aspect-ratio': 1.5.2
    '@rn-primitives/avatar': 1.5.2
    '@rn-primitives/checkbox': 1.5.2
    '@rn-primitives/collapsible': 1.5.2
    '@rn-primitives/context-menu': 1.5.2
    '@rn-primitives/dialog': 1.5.2
    '@rn-primitives/dropdown-menu': 1.5.2
    '@rn-primitives/hover-card': 1.5.2
    '@rn-primitives/label': 1.5.2
    '@rn-primitives/menubar': 1.5.2
    '@rn-primitives/popover': 1.5.2
    '@rn-primitives/portal': 1.5.2
    '@rn-primitives/progress': 1.5.2
    '@rn-primitives/radio-group': 1.5.2
    '@rn-primitives/select': 1.5.2
    '@rn-primitives/separator': 1.5.2
    '@rn-primitives/slot': 1.5.2
    '@rn-primitives/switch': 1.5.2
    '@rn-primitives/tabs': 1.5.2
    '@rn-primitives/toggle': 1.5.2
    '@rn-primitives/toggle-group': 1.5.2
    '@rn-primitives/tooltip': 1.5.2
  # addon:mobile end
  # ---------------------------------------------------------------------------
  # Install / build policy
  # ---------------------------------------------------------------------------

  # Packages allowed to run install/postinstall build scripts.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@swc/core'
  - esbuild
  - msgpackr-extract
  - msw

allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  core-js: false # postinstall only prints a funding banner — nothing to build
  esbuild: true
  msgpackr-extract: true
  msw: true
  unrs-resolver: true

# Supply-chain cooldown: a version published less than 2 days (2880 min) ago
# is refused, so yanked or malicious releases are caught before they land.
# `minimumReleaseAgeExclude` is the list of young versions deliberately let
# through; pnpm appends to it when an install resolves one (record the
# reason in the PR) and, with `minimumReleaseAgeExcludePrune`, deletes entries
# once their version has aged past the window — so the list stays a short
# record of current exceptions, not a permanent ledger. Until 2026-09-04 the
# setting itself was missing and this list was inert.
minimumReleaseAge: 2880
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nestjs/common@12.4.0'
  - '@nestjs/core@12.4.0'
  - '@nestjs/platform-node@12.4.0'
  - '@nestjs/testing@12.4.0'
  - 'tinyexec@1.3.1'
  - rc9@3.1.0
