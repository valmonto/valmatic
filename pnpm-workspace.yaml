packages:
  - apps/*
  - packages/*

# Force a single lightningcss version: react-native-css 3.0.7 (NativeWind v5's
# CSS engine) was built against lightningcss ^1.30.1 and cannot deserialize the
# changed @import "Specifier" AST that 1.32.0 emits (Metro bundling fails with
# "failed to deserialize; expected an object-like struct named Specifier,
# found ()"). Pin until NativeWind v5 catches up to newer lightningcss.
overrides:
  lightningcss: 1.30.1

# ---------------------------------------------------------------------------
# Catalog — single source of truth for dependency versions across the
# monorepo. Grouped by where each dependency is actually consumed:
#   • Repo tooling        — root-level release / lint / commit / format
#   • Shared toolchain    — TS, ESLint, test runners used by every package
#   • Shared runtime      — imported by both frontend and backend app code
#   • Backend             — apps/api, apps/worker, packages/{server,database}
#   • Frontend            — apps/web
#   • E2E                 — apps/e2e
# ---------------------------------------------------------------------------
catalog:
  # ═══════════════════════════════════════════════════════════════════════
  #  REPO TOOLING  (root devDependencies)
  #  Release automation, changelog, git hooks, commit linting, formatting.
  # ═══════════════════════════════════════════════════════════════════════
  '@commitlint/cli': 21.0.2
  '@commitlint/config-conventional': 21.0.2
  git-cliff: 2.13.1
  husky: 9.1.7
  prettier: 3.8.4
  release-it: 20.2.0

  # ═══════════════════════════════════════════════════════════════════════
  #  SHARED TOOLCHAIN  (TS / lint / test — used by every package)
  # ═══════════════════════════════════════════════════════════════════════
  typescript: 6.0.3
  typescript-eslint: 8.60.1
  eslint: 10.4.1
  '@eslint/js': 10.0.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-prettier: 5.5.6
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-boundaries: 6.0.2
  globals: 17.6.0
  '@types/node': 25.9.2
  vitest: 4.1.8
  '@vitest/coverage-v8': 4.1.8
  tsdown: 0.22.2 # library bundler for packages/*

  # ═══════════════════════════════════════════════════════════════════════
  #  SHARED RUNTIME  (imported by both frontend and backend app code)
  # ═══════════════════════════════════════════════════════════════════════
  axios: 1.17.0
  zod: 4.4.3

  # ═══════════════════════════════════════════════════════════════════════
  #  BACKEND  (apps/api, apps/worker, packages/server, packages/database)
  # ═══════════════════════════════════════════════════════════════════════

  # NestJS + Fastify
  '@nestjs/common': 11.1.26
  '@nestjs/core': 11.1.26
  '@nestjs/cli': 11.0.23
  '@nestjs/config': 4.0.4
  '@nestjs/event-emitter': 3.1.0
  '@nestjs/jwt': 11.0.2
  '@nestjs/platform-fastify': 11.1.26
  '@nestjs/testing': 11.1.26
  '@fastify/cookie': 11.0.2
  fastify: 5.8.5
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

  # Queues / cache
  '@nestjs/bullmq': 11.0.4
  bullmq: 5.78.0
  ioredis: 5.11.1

  # Database (Drizzle + Postgres)
  drizzle-orm: 1.0.0-rc.3
  drizzle-kit: 1.0.0-rc.3
  postgres: 3.4.9

  # Auth
  bcryptjs: 3.0.3

  # Logging (Pino)
  nestjs-pino: 4.6.1
  pino: 10.3.1
  pino-http: 11.0.0
  pino-pretty: 13.1.3

  # i18n (server-side)
  nestjs-i18n: 10.8.4

  # ═══════════════════════════════════════════════════════════════════════
  #  FRONTEND  (apps/web)
  # ═══════════════════════════════════════════════════════════════════════

  # React core + routing
  react: 19.2.7
  react-dom: 19.2.7
  react-router: 7.17.0
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3

  # Data / state / forms
  swr: 2.4.1
  zustand: 5.0.14
  react-hook-form: 7.78.0
  react-error-boundary: 6.1.2
  date-fns: 4.4.0

  # UI components / primitives
  radix-ui: 1.5.0
  '@base-ui/react': 1.5.0
  lucide-react: 1.17.0
  cmdk: 1.1.1
  sonner: 2.0.7
  vaul: 1.1.2
  input-otp: 1.4.2
  next-themes: 0.4.6
  embla-carousel-react: 8.6.0
  react-day-picker: 10.0.1
  react-resizable-panels: 4.11.2
  recharts: 3.8.1
  framer-motion: 12.40.0

  # Styling
  tailwindcss: 4.3.0
  '@tailwindcss/vite': 4.3.0
  tailwind-merge: 3.6.0
  tw-animate-css: 1.4.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1

  # i18n (client-side)
  i18next: 26.3.1
  i18next-browser-languagedetector: 8.2.1
  react-i18next: 17.0.8

  # Build + test (web)
  vite: 8.0.16
  '@vitejs/plugin-react-swc': 4.3.1
  jsdom: 29.1.1
  msw: 2.14.6
  fast-check: 4.9.0
  '@testing-library/react': 16.3.2
  '@testing-library/jest-dom': 6.9.1
  '@testing-library/user-event': 14.6.1

  # ═══════════════════════════════════════════════════════════════════════
  #  MOBILE  (apps/mobile) — Expo + React Native
  #  All mobile pins live in the named `mobile` catalog below (see `catalogs:`),
  #  kept separate because it needs its own React version (19.2.3, Expo's) that
  #  differs from the web React above. Shared libs (swr, zustand, zod, axios,
  #  react-hook-form, date-fns, i18next, react-i18next, tailwindcss) are reused
  #  from this default catalog via `catalog:`.
  # ═══════════════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════════════
  #  E2E  (apps/e2e)
  # ═══════════════════════════════════════════════════════════════════════
  '@playwright/test': 1.60.0

# ---------------------------------------------------------------------------
# Named catalogs — version groups that can't share the default catalog.
# ---------------------------------------------------------------------------
catalogs:
  # apps/mobile (Expo SDK 57). Referenced as `catalog:mobile`.
  #
  # Expo-managed packages (expo, expo-*, react-native*, react) are versioned by
  # the Expo SDK. When bumping the SDK, run `expo install --fix` in apps/mobile
  # and copy the resulting versions back here so the catalog stays the source of
  # truth. (`expo install` writes to the app's package.json, not the catalog.)
  mobile:
    # React — Expo's pinned version (differs from web's default-catalog React)
    react: 19.2.3
    react-dom: 19.2.3
    '@types/react': ~19.2.2

    # Expo SDK + modules
    expo: ~57.0.2
    '@expo/ui': ~57.0.3
    '@expo-google-fonts/inter': 0.4.2
    expo-constants: ~57.0.3
    expo-device: ~57.0.0
    expo-notifications: ~57.0.3
    expo-font: ~57.0.0
    expo-glass-effect: ~57.0.0
    expo-image: ~57.0.0
    expo-linking: ~57.0.1
    expo-blur: ~57.0.0
    expo-haptics: ~57.0.0
    expo-linear-gradient: ~57.0.0
    expo-router: ~57.0.3
    expo-secure-store: ~57.0.0
    expo-splash-screen: ~57.0.2
    expo-store-review: ~57.0.0
    expo-status-bar: ~57.0.0
    expo-symbols: ~57.0.0
    expo-system-ui: ~57.0.0
    expo-updates: ~57.0.0
    expo-web-browser: ~57.0.0

    # React Native + native modules
    react-native: 0.86.0
    react-native-gesture-handler: ~2.32.0
    react-native-reanimated: 4.5.0
    react-native-safe-area-context: ~5.7.0
    react-native-screens: 4.25.2
    react-native-svg: 15.15.4
    react-native-web: ~0.21.0
    react-native-worklets: 0.10.0

    # Styling — NativeWind v5 (Tailwind v4). nativewind ships only prereleases
    # today, so the exact preview tag is required (^5.0.0 excludes prereleases).
    nativewind: 5.0.0-preview.4
    react-native-css: ^3.0.7 # NW5 peer (formerly react-native-css-interop; at 3.x)
    '@tailwindcss/postcss': 4.3.0 # Tailwind v4 via PostCSS in Metro (web uses @tailwindcss/vite)

    # Lint — kept out of the default catalog (which is on ESLint 10): eslint-config-expo
    # 57 only supports ESLint 9, so the mobile app needs its own ESLint 9 here.
    eslint: ^9.39.4
    eslint-config-expo: ~57.0.0

    # UI — icons, charts, toasts (RNR components are copied in, not a dep)
    lucide-react-native: 1.21.0
    victory-native: 41.26.0 # charts — recharts does not run in RN
    sonner-native: 0.26.2

    # RNR component primitives (the accessible base layer RNR components build on).
    # Whole family is versioned in lockstep — keep versions identical.
    '@rn-primitives/accordion': 1.5.2
    '@rn-primitives/alert-dialog': 1.5.2
    '@rn-primitives/aspect-ratio': 1.5.2
    '@rn-primitives/avatar': 1.5.2
    '@rn-primitives/checkbox': 1.5.2
    '@rn-primitives/collapsible': 1.5.2
    '@rn-primitives/context-menu': 1.5.2
    '@rn-primitives/dialog': 1.5.2
    '@rn-primitives/dropdown-menu': 1.5.2
    '@rn-primitives/hover-card': 1.5.2
    '@rn-primitives/label': 1.5.2
    '@rn-primitives/menubar': 1.5.2
    '@rn-primitives/popover': 1.5.2
    '@rn-primitives/portal': 1.5.2
    '@rn-primitives/progress': 1.5.2
    '@rn-primitives/radio-group': 1.5.2
    '@rn-primitives/select': 1.5.2
    '@rn-primitives/separator': 1.5.2
    '@rn-primitives/slot': 1.5.2
    '@rn-primitives/switch': 1.5.2
    '@rn-primitives/tabs': 1.5.2
    '@rn-primitives/toggle': 1.5.2
    '@rn-primitives/toggle-group': 1.5.2
    '@rn-primitives/tooltip': 1.5.2

# ---------------------------------------------------------------------------
# Install / build policy
# ---------------------------------------------------------------------------

# Packages allowed to run install/postinstall build scripts.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@swc/core'
  - esbuild
  - msgpackr-extract
  - msw

allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  msw: true
  unrs-resolver: true

# Supply-chain cooldown: wait 2 days (2880 min) before a newly published
# version is installable, so yanked/malicious releases are caught first.
# Listed packages are exempt from the cooldown.
minimumReleaseAgeExclude:
  - '@nestjs/cli@11.0.23'
  - prettier@3.8.4
  - '@expo/cli@57.0.4'
  - '@expo/config-plugins@57.0.2'
  - '@expo/config@57.0.2'
  - '@expo/env@2.4.1'
  - '@expo/fingerprint@0.20.2'
  - '@expo/image-utils@0.11.1'
  - '@expo/local-build-cache-provider@57.0.2'
  - '@expo/metro-config@57.0.3'
  - '@expo/metro-runtime@57.0.3'
  - '@expo/prebuild-config@57.0.4'
  - '@expo/require-utils@57.0.1'
  - '@expo/schema-utils@57.0.1'
  - '@expo/ui@57.0.3'
  - expo-asset@57.0.3
  - expo-constants@57.0.3
  - expo-modules-autolinking@57.0.4
  - expo-modules-core@57.0.2
  - expo-router@57.0.3
  - expo-splash-screen@57.0.2
  - expo@57.0.2
  - '@rn-primitives/label@1.5.2'
  - '@rn-primitives/slot@1.5.2'
  - '@rn-primitives/types@1.5.2'
  - '@rn-primitives/accordion@1.5.2'
  - '@rn-primitives/alert-dialog@1.5.2'
  - '@rn-primitives/aspect-ratio@1.5.2'
  - '@rn-primitives/avatar@1.5.2'
  - '@rn-primitives/checkbox@1.5.2'
  - '@rn-primitives/collapsible@1.5.2'
  - '@rn-primitives/context-menu@1.5.2'
  - '@rn-primitives/dialog@1.5.2'
  - '@rn-primitives/dropdown-menu@1.5.2'
  - '@rn-primitives/hooks@1.5.2'
  - '@rn-primitives/hover-card@1.5.2'
  - '@rn-primitives/menubar@1.5.2'
  - '@rn-primitives/popover@1.5.2'
  - '@rn-primitives/portal@1.5.2'
  - '@rn-primitives/progress@1.5.2'
  - '@rn-primitives/radio-group@1.5.2'
  - '@rn-primitives/select@1.5.2'
  - '@rn-primitives/separator@1.5.2'
  - '@rn-primitives/switch@1.5.2'
  - '@rn-primitives/tabs@1.5.2'
  - '@rn-primitives/toggle-group@1.5.2'
  - '@rn-primitives/toggle@1.5.2'
  - '@rn-primitives/tooltip@1.5.2'
  - '@rn-primitives/utils@1.5.2'
  - '@expo/env@2.3.1'
  - '@expo/fingerprint@0.19.6'
  - '@expo/image-utils@0.10.2'
  - '@expo/inline-modules@0.0.13'
