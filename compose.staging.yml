services:
  postgres:
    image: postgres:18.7
    container_name: vboilerplatedb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-vboilerplate}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-vboilerplate}
    volumes:
      - vboilerplatedb_data:/var/lib/postgresql
    networks:
      - staging_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-vboilerplate} -d ${DB_NAME:-vboilerplate}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.12.0-alpine
    container_name: vboilerplateredis
    env_file:
      - .env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - vboilerplateredis_data:/data
    networks:
      - staging_network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # One-shot migration runner. Reuses the API image but overrides the
  # entrypoint to apply migrations and exit. Runs exactly once before api/worker
  # start, so multiple api replicas never race to migrate.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILT_AT: ${BUILT_AT:-}
    container_name: vboilerplatemigrate
    env_file:
      - .env
    # Override host-loopback values from .env: on the compose network the DB is
    # reachable by service name, not 127.0.0.1. Build the URL from DB_PASSWORD so
    # it always matches what Postgres was initialized with.
    environment:
      DATABASE_URL: postgresql://${DB_USER:-vboilerplate}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-vboilerplate}
    # Path follows the image layout, and MUST change with it. `pnpm deploy`
    # flattens the app to the image root, so /app/packages no longer exists —
    # pointing here at the old path takes production down: migrate fails, api
    # depends on migrate completing, nothing starts, 502.
    entrypoint: ['node', '/app/node_modules/@pkg/database/dist/cli/migrate.mjs']
    networks:
      - staging_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILT_AT: ${BUILT_AT:-}
    # No container_name: it must be unique, which blocks `--scale api=N`.
    # Compose auto-names replicas (valmatic-dev-api-1, -2, …).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # See migrate service: reach backing services by name, not 127.0.0.1.
      DATABASE_URL: postgresql://${DB_USER:-vboilerplate}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-vboilerplate}
      REDIS_HOST: redis
      IAM_REDIS_HOST: redis
    # Two copies, reachable only on the compose network: caddy load-balances
    # them (caddy/app.caddy), so a restart of one is not an outage. More with
    # `--scale api=N` or API_REPLICAS; no host ports, so copies never clash.
    deploy:
      replicas: ${API_REPLICAS:-2}
    expose:
      - '3000'
    networks:
      - staging_network
    # Without this, `docker compose up --wait` only waits for the container to
    # be *running*, so an api that boots and then fails its first request still
    # reports a green deploy. Uses node's global fetch — no curl/wget in the
    # alpine runtime image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The front door and the only published port: the web build inside Caddy,
  # /api load-balanced across the api copies. Plain http; put TLS in front
  # (a host Caddy, Cloudflare). Several apps on one VM: give each its own
  # GATEWAY_HOST_PORT. See caddy/README.md.
  caddy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    container_name: vboilerplatecaddy
    environment:
      # Behind a proxy that sets X-Client-IP (Specbook's server Caddy), its
      # addresses; unset, only the peer's own address counts.
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - '${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HOST_PORT:-3010}:3000'
    networks:
      - staging_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILT_AT: ${BUILT_AT:-}
    # No container_name so the worker can also scale (--scale worker=N).
    # It publishes no host port, so replicas don't conflict.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # See migrate service: reach backing services by name, not 127.0.0.1.
      DATABASE_URL: postgresql://${DB_USER:-vboilerplate}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-vboilerplate}
      REDIS_HOST: redis
      IAM_REDIS_HOST: redis
    networks:
      - staging_network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vboilerplatedb_data:
  vboilerplateredis_data:

networks:
  staging_network:
    driver: bridge
